plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.findaries'
version = '1.0.3'
base { archivesName = 'findaries-horror' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); mods { findaries_horror { source sourceSets.main } } }
        client {
            if (project.hasProperty('fdSmokeClient')) args '--quickPlayMultiplayer', '127.0.0.1:25566'
        }
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }

jar {
    manifest {
        attributes([
            'Specification-Title': project.name,
            'Specification-Vendor': 'findaries',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'findaries'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
