name: Build Forge mod

on:
  push:
    branches:
      - arena/4c314abf-fin-daries-horror-mod
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Gradle failure summary'
              echo '```text'
              grep -A4 -B1 -E '(error:|^FAILURE:|^\* What went wrong:|Could not resolve|Could not find|Caused by:)' build.log | tail -n 60 || tail -n 80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep -A4 -B1 -E '(error:|^FAILURE:|^\* What went wrong:|Could not resolve|Could not find|Caused by:)' build.log | tail -n 30 | tr '\n' ' ' | cut -c1-1800)
            if [ -z "$summary" ]; then summary=$(tail -n 20 build.log | tr '\n' ' ' | cut -c1-1800); fi
            echo "::error file=README.md,line=1,title=Gradle build failed::$summary"
          fi
          exit "$result"
      - name: Smoke-test dedicated server world startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke-test\n' > run/server.properties
          set +e
          timeout 240s gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 150); do
            if grep -q 'Done (' server-smoke.log; then
              echo 'Dedicated server loaded the world successfully.'
              kill "$server_pid" 2>/dev/null
              wait "$server_pid" 2>/dev/null
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              result=$?
              tail -n 100 server-smoke.log
              exit "$result"
            fi
            sleep 2
          done
          tail -n 100 server-smoke.log
          kill "$server_pid" 2>/dev/null
          wait "$server_pid" 2>/dev/null
          echo 'Timed out waiting for the test world to start.'
          exit 1
      - name: Report server startup failure
        if: failure() && hashFiles('server-smoke.log') != ''
        shell: bash
        run: |
          {
            echo '### Dedicated server startup diagnostics'
            echo '```text'
            tail -n 80 server-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          details=$(tail -n 24 server-smoke.log | tr '\n' ' ' | cut -c1-1800)
          echo "::error file=README.md,line=1,title=Server smoke test failed::$details"
      - name: Upload server log on failure
        if: failure() && hashFiles('server-smoke.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log-${{ github.sha }}
          path: server-smoke.log
          retention-days: 7
      - name: Upload build log on failure
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: findaries-horror-${{ github.sha }}
          path: build/libs/findaries-horror-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fin Daries Horror ${{ github.ref_name }}
          files: build/libs/findaries-horror-*.jar
          generate_release_notes: true
          make_latest: true
