name: Build Forge mod

on:
  push:
    branches:
      - arena/4c314abf-fin-daries-horror-mod
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: findaries-horror-${{ github.sha }}
          path: build/libs/findaries-horror-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fin Daries Horror ${{ github.ref_name }}
          files: build/libs/findaries-horror-*.jar
          generate_release_notes: true
          make_latest: true
