name: Build Forge mod

on:
  push:
    branches:
      - arena/4c314abf-fin-daries-horror-mod
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            {
              echo '### Gradle failure summary'
              echo '```text'
              grep -A4 -B1 -E '(error:|^FAILURE:|^\* What went wrong:|Could not resolve|Could not find|Caused by:)' build.log | tail -n 60 || tail -n 80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep -A4 -B1 -E '(error:|^FAILURE:|^\* What went wrong:|Could not resolve|Could not find|Caused by:)' build.log | tail -n 30 | tr '\n' ' ' | cut -c1-1800)
            if [ -z "$summary" ]; then summary=$(tail -n 20 build.log | tr '\n' ' ' | cut -c1-1800); fi
            echo "::error file=README.md,line=1,title=Gradle build failed::$summary"
          fi
          exit "$result"
      - name: Smoke-test dedicated server world startup
        id: server_smoke
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=smoke-test\nenable-rcon=true\nrcon.password=fdsmoke\nrcon.port=25575\n' > run/server.properties
          set +e
          timeout 240s gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 150); do
            if grep -q 'Done (' server-smoke.log; then
              echo 'Dedicated server loaded the world successfully.'
              python3 - <<'PY'
          import socket, struct, time
          def recv_exact(sock, count):
              chunks = bytearray()
              while len(chunks) < count:
                  part = sock.recv(count - len(chunks))
                  if not part:
                      raise OSError('RCON socket closed')
                  chunks.extend(part)
              return bytes(chunks)
          def packet(sock, request_id, kind, body):
              data = struct.pack('<ii', request_id, kind) + body.encode() + b'\0\0'
              sock.sendall(struct.pack('<i', len(data)) + data)
              length = struct.unpack('<i', recv_exact(sock, 4))[0]
              response = recv_exact(sock, length)
              return struct.unpack('<ii', response[:8])
          for attempt in range(30):
              try:
                  with socket.create_connection(('127.0.0.1', 25575), timeout=2) as sock:
                      packet(sock, 1, 3, 'fdsmoke')
                      packet(sock, 2, 2, 'stop')
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
              wait "$server_pid"
              result=$?
              if [ "$result" -ne 0 ]; then tail -n 100 server-smoke.log; exit "$result"; fi
              test -f run/smoke-test/level.dat
              mkdir -p run/saves
              cp -a run/smoke-test run/saves/smoke-test
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              result=$?
              tail -n 100 server-smoke.log
              exit "$result"
            fi
            sleep 2
          done
          tail -n 100 server-smoke.log
          kill "$server_pid" 2>/dev/null
          wait "$server_pid" 2>/dev/null
          echo 'Timed out waiting for the test world to start.'
          exit 1
      - name: Smoke-test Forge client loading a world
        id: client_smoke
        shell: bash
        run: |
          set +e
          timeout 360s xvfb-run -a gradle runClient --no-daemon -PfdSmokeClient > client-smoke.log 2>&1 &
          client_pid=$!
          for attempt in $(seq 1 180); do
            if grep -q 'Done (' client-smoke.log; then
              echo 'Forge client opened the smoke-test world successfully.'
              kill "$client_pid" 2>/dev/null
              wait "$client_pid" 2>/dev/null
              exit 0
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              wait "$client_pid"
              result=$?
              tail -n 120 client-smoke.log
              exit "$result"
            fi
            sleep 2
          done
          tail -n 120 client-smoke.log
          kill "$client_pid" 2>/dev/null
          wait "$client_pid" 2>/dev/null
          echo 'Timed out waiting for the integrated test world to open.'
          exit 1
      - name: Report client startup failure
        if: failure() && steps.client_smoke.outcome == 'failure' && hashFiles('client-smoke.log') != ''
        shell: bash
        run: |
          {
            echo '### Forge client world-load diagnostics'
            echo '```text'
            tail -n 100 client-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          details=$(tail -n 30 client-smoke.log | tr '\n' ' ' | cut -c1-1800)
          echo "::error file=README.md,line=1,title=Client world smoke test failed::$details"
      - name: Upload client log on failure
        if: failure() && steps.client_smoke.outcome == 'failure' && hashFiles('client-smoke.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-log-${{ github.sha }}
          path: client-smoke.log
          retention-days: 7
      - name: Report server startup failure
        if: failure() && steps.server_smoke.outcome == 'failure' && hashFiles('server-smoke.log') != ''
        shell: bash
        run: |
          {
            echo '### Dedicated server startup diagnostics'
            echo '```text'
            tail -n 80 server-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          details=$(tail -n 24 server-smoke.log | tr '\n' ' ' | cut -c1-1800)
          echo "::error file=README.md,line=1,title=Server smoke test failed::$details"
      - name: Upload server log on failure
        if: failure() && steps.server_smoke.outcome == 'failure' && hashFiles('server-smoke.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log-${{ github.sha }}
          path: server-smoke.log
          retention-days: 7
      - name: Upload build log on failure
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: findaries-horror-${{ github.sha }}
          path: build/libs/findaries-horror-*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fin Daries Horror ${{ github.ref_name }}
          files: build/libs/findaries-horror-*.jar
          generate_release_notes: true
          make_latest: true
